# Nginx Reverse Proxy Configuration
# Handles SSL termination (via Certbot/Let's Encrypt) and proxies
# traffic from https://api.yourdomain.com → Docker container on port 3001.
#
# Setup steps on your EC2 instance:
#   1. sudo apt install nginx certbot python3-certbot-nginx
#   2. Copy this file to /etc/nginx/sites-available/zeviodesk-api
#   3. sudo ln -s /etc/nginx/sites-available/zeviodesk-api /etc/nginx/sites-enabled/
#   4. Replace all occurrences of "api.yourdomain.com" with your actual domain
#   5. sudo nginx -t && sudo systemctl reload nginx
#   6. sudo certbot --nginx -d api.yourdomain.com   ← Certbot auto-fills the SSL block below

# ─── HTTP → HTTPS redirect ────────────────────────────────────────────────────
server {
    listen 80;
    server_name api.yourdomain.com;

    # Certbot will add its own challenge location block here
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ─── HTTPS (SSL) ──────────────────────────────────────────────────────────────
server {
    listen 443 ssl http2;
    server_name api.yourdomain.com;

    # Certbot manages these paths after running:  certbot --nginx -d api.yourdomain.com
    ssl_certificate     /etc/letsencrypt/live/api.yourdomain.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.yourdomain.com/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    # ── Security headers (complement Helmet in Express) ──────────────────────
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    add_header X-Frame-Options DENY always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # ── Request limits ───────────────────────────────────────────────────────
    client_max_body_size 10m;

    # ── Proxy to Docker container ─────────────────────────────────────────────
    location / {
        proxy_pass          http://127.0.0.1:3001;
        proxy_http_version  1.1;

        # Required for WebSocket / SSE if used
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";

        # Pass real client info to Express
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Timeouts
        proxy_connect_timeout 60s;
        proxy_send_timeout    60s;
        proxy_read_timeout    60s;
    }

    # ── Health endpoint — skip access logs ────────────────────────────────────
    location = /api/health {
        proxy_pass http://127.0.0.1:3001;
        access_log off;
    }
}
