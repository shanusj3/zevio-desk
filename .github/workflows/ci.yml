name: CI Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Use Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '22'
        cache: 'npm'
        cache-dependency-path: zeviodesk-backend/package-lock.json

    - name: Install Dependencies
      working-directory: ./zeviodesk-backend
      run: npm ci

    - name: Check DB Migrations (Dry Run)
      working-directory: ./zeviodesk-backend
      run: npx prisma migrate status
      env:
        DATABASE_URL: ${{ secrets.DATABASE_URL }}
